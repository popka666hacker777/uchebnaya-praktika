<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Проверка форм</title>
    <script src="js/form.js" defer></script>
</head>
<style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 30px auto;
            padding: 15px;
        }

        label {
            display: block;
            margin-top: 12px;
            margin-bottom: 4px;
        }

        input {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }

        button {
            margin-top: 15px;
            margin-right: 6px;
            padding: 8px 14px;
            cursor: pointer;
        }

        .error {
            color: red;
        }

        .success {
            color: green;
        }

        body.dark {
            background-color: #16213e;
            color: #e2e8f0;
        }

        body.dark input,
        body.dark button {
            background-color: #0f3460;
            color: #ffffff;
            border: 1px solid #533483;
        }


  </style>
<body>

    <h1>Регистрация студента</h1>

    <form id="registration-form" novalidate>

        <label for="student-name">Имя</label>
        <input type="text" id="student-name">

        <label for="student-email">Email</label>
        <input type="email" id="student-email">

        <label for="student-password">Пароль</label>
        <input type="password" id="student-password">

        <button type="submit">Проверить данные</button>

    </form>

    <p id="result"></p>

    <h2>Настройки пользователя</h2>

    <button id="save-name">Сохранить имя</button>
    <button id="show-name">Показать имя</button>
    <button id="delete-name">Удалить имя</button>

    <br><br>



    <p id="saved-result"></p>

    <p id="saved-result"></p>

    <input type="text" id="student-group" placeholder="Введите группу">
    <button id="save-group">Сохранить группу</button>
    <button id="show-group">Показать группу</button>

     <h2>Тема оформления</h2>

    <button id="theme-btn">Переключить тему</button>
    <p id="theme-status"></p>

</body>

</html>
