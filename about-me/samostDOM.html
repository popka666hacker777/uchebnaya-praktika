<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Самостоятельная работа — DOM</title>
  <script src="js/samostDOM.js" defer></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      line-height: 1.5;
    }

    .course-card {
      margin-top: 40px;
      padding: 20px;
      border: 2px solid #cbd5e1;
      background-color: #f8fafc;
      border-radius: 8px;
      max-width: 500px;
    }

    .course-card h2 {
      margin-top: 0;
      font-size: 1.25rem;
      color: #1e293b;
    }

    .success {
      color: #15803d;
      font-weight: bold;
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <h1>Лабораторная работа по JavaScript</h1>
  <p>Работа с объектной моделью документа (DOM).</p>

  <section class="course-card">
    <h2>Информация о курсе</h2>
    <p id="course-discipline"></p>
    <p id="course-student"></p>
    <p id="course-group"></p>
    <p id="course-topics"></p>
    <p id="course-result"></p>
  </section>

</body>
</html>
