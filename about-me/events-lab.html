<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript: события</title>
    <script src="js/events.js" defer></script>
</head>

<body>
    <h1>Лаборатория событий JavaScript</h1>

    <h2>Задача 1. Кнопка</h2>
    <button id="hello-btn">Нажми меня</button>
    <p id="hello-result">Ожидание...</p>

    <h2>Задача 2. Счётчик</h2>
    <p>Количество: <span id="counter">0</span></p>
    <button id="plus-btn">+1</button>
    <button id="minus-btn">-1</button>
    <button id="reset-btn">Сброс</button>
    <button id="plus5-btn">+5</button>

    <h2>Задача 3. Приветствие</h2>
    <input type="text" id="name-input" placeholder="Введите имя">
    <p id="name-result">Введите ваше имя</p>

    <h2>Задача 4. Изменение оформления</h2>
    <div id="color-box" style="padding: 20px; border: 1px solid black;">
        Это цветной блок.
    </div>
    <button id="color-btn">Изменить цвет</button>

     <h2>Задача 5. Проверка формы</h2>
    <form id="feedback-form" novalidate>
        <input type="text" id="feedback-name" placeholder="Ваше имя">
        <input type="number" id="feedback-age" placeholder="Ваш возраст">
        <button type="submit">Отправить</button>
    </form>
    <p id="form-result"></p>
    <h2>Задача 6. Калькулятор</h2>
    <input type="number" id="num1" placeholder="Первое число">
    <input type="number" id="num2" placeholder="Второе число">
    <br><br>
    <button id="add-btn">+</button>
    <button id="sub-btn">-</button>
    <button id="mul-btn">*</button>
    <button id="div-btn">/</button>
    <p id="calc-result">Результат: </p>

</body>

</html>
